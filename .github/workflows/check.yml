name: Check website changes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build from content
        run: python3 build.py
      - name: Check links, ordering, media categories and asset integrity
        run: python3 check.py
      - name: Check JavaScript syntax
        run: node --check src/site.js
      - name: Retain reviewable build
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: dist
          retention-days: 14
